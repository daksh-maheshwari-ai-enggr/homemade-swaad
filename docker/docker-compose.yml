services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "4001:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5001
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - ../apps/api/.env
    depends_on:
      - redis

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "5001:80"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: